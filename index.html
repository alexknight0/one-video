<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0f0f0f">
  <title>One Video</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="home-link" href="../home/" aria-label="Home">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 10v9h5v-5h4v5h5v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <h1>One Video</h1>
    <button id="version" type="button" class="version" data-state="checking" aria-label="Checking for updates…"><i></i><span></span></button>
    <button id="change-btn" type="button" class="change-btn" hidden>Change video</button>
  </header>

  <!-- Shown while sign-in is being checked; CSS reveals the "taking a while" line after 10s. -->
  <section id="boot" class="centre">
    <div class="spinner"></div>
    <p>Checking sign-in…</p>
    <p id="boot-slow" class="muted">This is taking a while. <a href="">Reload</a></p>
  </section>

  <!-- Sign-in gate (Alex, plus anyone on the watch list in config/access). -->
  <section id="gate" class="centre" hidden>
    <p id="gate-msg">Sign in to upload and watch your video.</p>
    <button id="signin-btn" type="button" class="primary">Sign in with Google</button>
  </section>

  <main id="app" hidden>
    <div id="player-wrap" hidden>
      <div class="ratio">
        <video id="player" playsinline controls></video>
      </div>
    </div>

    <p id="empty" class="empty">No video yet. Choose a video file below.</p>

    <!-- Upload / change form -->
    <form id="upload-form" class="dock" hidden>
      <label class="pick">
        <span id="pick-label">Choose a video…</span>
        <input id="file-input" type="file" accept="video/*" hidden>
      </label>
      <input id="time-input" type="text" inputmode="numeric" autocomplete="off"
        placeholder="Start (0:00)" aria-label="Start time" class="time">
      <button type="submit" id="save-btn">Save</button>
    </form>

    <!-- Upload / download progress -->
    <div id="progress" class="progress" hidden>
      <div id="progress-bar"></div>
      <span id="progress-text"></span>
    </div>

    <p id="error" class="error" hidden></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
